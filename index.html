<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/dashboardstyles.css" />
    <title>Dashboard</title>
  </head>
  <body>
    <aside>
      <div class="top-nav">
        <!--I will put an image here later-->
        <h1>Dashboard</h1>
      </div>
      <nav class="navbar">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Profile</a></li>
          <li><a href="#">Messages</a></li>
          <li><a href="#">History</a></li>
          <li><a href="#">Tasks</a></li>
          <li><a href="#">Communities</a></li>
        </ul>
        <ul>
          <li><a href="#">Settings</a></li>
          <li><a href="#">Suppor</a></li>
          <li><a href="#">Privacy</a></li>
        </ul>
      </nav>
    </aside>

    <main>
      <header>
        <div class="header-content">
          <div class="searchbar">
            <input type="text" placeholder="Search" />
          </div>
          <div class="header-notifs">
            <span class="notif-icon">Placeholder</span>
            <span class="profile-icon">Placeholder</span>
            <span class="user">John Doe</span>
          </div>
        </div>

        <div class="user-banner">
          <div class="user-info">
            <!--I will put an image here later-->
            <div class="user-details">
              <span class="user-name">Hi there,</span>
              <span class="user-role">John Doe</span>
            </div>
          </div>

          <div class="user-actions">
            <button>New</button>
            <button>Upload</button>
            <button>Share</button>
          </div>
        </div>
      </header>

      <section class="dashboard-area">
        <section class="project-grid">
          <article class="project-cards">

          </article>
        </section>

        <section class="side-grid">
          <article class="announcements-card">

          </article>
          <article class="trending-card">
            
          </article>
        </section>
      </section>
    </main>
  </body>
</html>
